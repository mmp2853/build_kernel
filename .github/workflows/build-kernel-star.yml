name: Build flashable kernel (MIUI/HyperOS star)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Kernel Source Code
      uses: actions/checkout@v3
      with:
        github-server-url: 'https://github.com'
        repository: mmp2853/android_kernel_xiaomi_sm8350-miui
        ref: ASB-2024-10-05
        path: kernel-srcroot
    
    - name: Setup Build Environment
      run: |
        sudo apt-get -y update
        sudo apt-get install git-core gnupg flex bison build-essential zip curl zlib1g-dev gcc-multilib g++-multilib libc6-dev-i386 libncurses-dev x11proto-core-dev libx11-dev lib32z1-dev libgl1-mesa-dev libxml2-utils xsltproc unzip fontconfig p7zip-full python3 cpio

    - name: Setup Nathan Slim Clang
      run: |
        mkdir ./toolchain
        cd ./toolchain
        curl -o llvm-18.tar.gz https://mirrors.edge.kernel.org/pub/tools/llvm/files/llvm-18.1.8-x86_64.tar.gz
        tar -xvf llvm-18.tar.gz
        TARGET_CLANG_PATH="$(pwd)/$(find ./ -name "bin")"
        echo "TARGET_CLANG_PATH=${TARGET_CLANG_PATH}" > $GITHUB_ENV

    - name: Setup Kernel SU
      run: |
        cd kernel-srcroot
        git submodule init
        git submodule update --checkout
       
    - name: Apply Patch
    
      run: |
        # 确保进入 KernelSU 子模块目录
        cd kernel-srcroot/KernelSU
        
        # 1. 修复 pkg_observer.c (解决 fsnotify API 报错)
        sed -i 's/ksu_handle_inode_event(struct fsnotify_mark \*mark, u32 mask, struct inode \*inode, struct inode \*dir,/ksu_handle_event(struct fsnotify_group *group, struct inode *inode, u32 mask, const void *data, int data_type,/g' kernel/manager/pkg_observer.c
        sed -i 's/const struct qstr \*file_name, u32 cookie)/const struct qstr *file_name, u32 cookie, struct fsnotify_iter_info *iter_info)/g' kernel/manager/pkg_observer.c
        sed -i 's/.handle_inode_event = ksu_handle_inode_event,/.handle_event = ksu_handle_event,/g' kernel/manager/pkg_observer.c

        # 2. 修复 ksud_integration.c (定义缺失的 copy_from_user_nofault 等)
        # 在头文件后注入宏定义
        sed -i '/#include "manager\/throne_tracker.h"/a \\n#include <linux/version.h>\n#if LINUX_VERSION_CODE < KERNEL_VERSION(5, 10, 0)\n#ifndef copy_from_user_nofault\n#define copy_from_user_nofault(dst, src, size) probe_kernel_read(dst, src, size)\n#endif\n#ifndef copy_to_user_nofault\n#define copy_to_user_nofault(dst, src, size) probe_kernel_write(dst, src, size)\n#endif\n#endif' kernel/runtime/ksud_integration.c

        # 3. 修复 patch_memory.c (定义缺失的 copy_to_kernel_nofault)
        sed -i '/#include <asm\/smp_plat.h>/a \\n#include <linux/version.h>\n#if LINUX_VERSION_CODE < KERNEL_VERSION(5, 10, 0)\n#ifndef copy_to_kernel_nofault\n#define copy_to_kernel_nofault(dst, src, size) probe_kernel_write(dst, src, size)\n#endif\n#endif' kernel/hook/arm64/patch_memory.c

        cd $GITHUB_WORKSPACE/kernel-srcroot
        patch -p1 < kernel-4.19.patch
        


    - name: Build Kernel for star
      run: |
        cd kernel-srcroot
        PATH=${{ env.TARGET_CLANG_PATH }}/:$PATH
        clang --version

        bash build.sh all star

        echo "TARGET_KERNEL_FLASHABLE_NAME=$(ls ../out/anykernel/ | grep Hana)" >> $GITHUB_ENV

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ env.TARGET_KERNEL_FLASHABLE_NAME }}
        path: out/anykernel/Hana-kernel-*
